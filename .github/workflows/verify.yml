name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri's Linux build links against WebKitGTK and related system libraries.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Check frontend JavaScript syntax
        shell: bash
        run: find app_unpacked/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
