name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri's Linux build links against WebKitGTK and related system libraries.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Check frontend JavaScript syntax
        run: npm run check:syntax

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Generate Node coverage report
        run: npm run test:coverage

      - name: Upload Node coverage report
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: artifacts/coverage
          if-no-files-found: error

      - name: Check frontend JavaScript syntax
        run: npm run check:syntax

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Windows Tauri E2E smoke test
        run: npm run test:e2e

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-diagnostics
          path: |
            artifacts/e2e-poc/**
            logs/**
          if-no-files-found: ignore
