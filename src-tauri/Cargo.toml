[package]
name = "treader-shell"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
e2e-webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
mime_guess = "2"
rfd = "0.14"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
